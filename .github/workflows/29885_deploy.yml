# Workflow za deployment Docker image na DockerHub
name: 29885 Deploy Workflow

# Sproži se po uspešnem zaključku test workflow-a
on:
  workflow_run:
    workflows: ["29885 Test Workflow"]
    types:
      - completed
    branches:
      - main

jobs:
  # POSEL: Zgradi in objavi Docker image
  build-and-push-docker:
    name: Build in Push na DockerHub
    runs-on: self-hosted
    
    # Izvede se samo če je test workflow uspešen
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      # Prevzemi kodo iz repozitorija
      - name: Checkout repository
        uses: actions/checkout@v3
      
      # Poskusi prenesti napaka.txt iz test workflow-a
      - name: Download test artifacts
        uses: dawidd6/action-download-artifact@v2
        continue-on-error: true
        with:
          workflow: 29885_test.yml
          name: error-log
          path: ./
      
      # Preveri napaka.txt če obstaja
      - name: Preveri napaka.txt iz testov
        run: |
          if [ -f napaka.txt ]; then
            if [ -s napaka.txt ]; then
              echo "❌ Napaka.txt vsebuje napake - prekinjam deployment"
              cat napaka.txt
              exit 1
            fi
            echo "✓ Napaka.txt je prazen - testi uspešni"
          else
            echo "⚠ Napaka.txt ne obstaja - nadaljujem (workflow uspešen)"
          fi
      
      # Preveri da so vse potrebne datoteke prisotne
      - name: Preveri prisotnost datotek
        run: |
          echo "Preverjam prisotnost potrebnih datotek..."
          test -f main.c && echo "✓ main.c"
          test -f Makefile && echo "✓ Makefile"
          test -f Dockerfile && echo "✓ Dockerfile"
      
      # Nastavi Docker Buildx (za boljšo podporo)
      - name: Nastavi Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      # Prijavi se v DockerHub
      - name: Login v DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # Pripravi Docker metadata (tags, labels)
      - name: Pripravi Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          # Uporabi svoje DockerHub uporabniško ime!
          images: ${{ secrets.DOCKERHUB_USERNAME }}/29885-stopnje-prevajanja
          tags: |
            type=raw,value=latest
            type=sha,prefix=git-
            type=ref,event=branch
      
      # Zgradi in potisni Docker image
      - name: Build in Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/29885-stopnje-prevajanja:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/29885-stopne-prevajanja:buildcache,mode=max
      
      # Preveri da je image res objavljen
      - name: Preveri objavljeni image
        run: |
          echo "✓ Docker image uspešno objavljen!"
          echo "Image tags:"
          echo "${{ steps.meta.outputs.tags }}"
      
      # Testiraj Docker image lokalno
      - name: Test Docker image lokalno
        run: |
          echo "Testiram Docker image..."
          docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/29885-stopnje-prevajanja:latest
          echo "✓ Docker image deluje pravilno!"
